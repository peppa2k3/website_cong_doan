services:
  mongo:
    image: mongo:6.0
    container_name: congdoan-mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      # Bỏ trống để chạy không xác thực (chỉ phù hợp mạng nội bộ cô lập).
      # Khuyến nghị production: đặt user/pass và cập nhật MONGO_URI trong backend/.env tương ứng.
      MONGO_INITDB_DATABASE: congdoan_portal
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [congdoan-net]

  backend:
    build: ./backend
    container_name: congdoan-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/congdoan_portal
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000" # Có thể bỏ nếu chỉ truy cập qua frontend/reverse proxy
    networks: [congdoan-net]

  frontend:
    build: ./frontend
    container_name: congdoan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks: [congdoan-net]

  # Tự động sao lưu MongoDB mỗi ngày, giữ lại 14 bản gần nhất
  mongo-backup:
    image: mongo:6.0
    container_name: congdoan-mongo-backup
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    networks: [congdoan-net]

networks:
  congdoan-net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
