server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API requests tới backend container
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # File tĩnh đã upload (ảnh, văn bản, media)
    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
        proxy_set_header Host $host;
    }

    # Cache tài nguyên tĩnh đã build
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - mọi route khác trả về index.html cho React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }
}
